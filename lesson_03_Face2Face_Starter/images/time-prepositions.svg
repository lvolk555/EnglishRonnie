<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="470" fill="#fdfcf8"/>
  <text x="450" y="44" font-family="DejaVu Sans" font-size="30" font-weight="bold" text-anchor="middle" fill="#333">at / on / in — time prepositions</text>
  <text x="450" y="72" font-family="DejaVu Sans" font-size="16" text-anchor="middle" fill="#777">small (clock) = at    bigger (day) = on    biggest (part of day / month / year) = in</text>

  <!-- AT panel -->
  <rect x="25" y="92" width="270" height="300" rx="14" fill="#eaf4fb" stroke="#7fb3d9" stroke-width="2"/>
  <text x="160" y="126" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" fill="#2471a3">at</text>
  <text x="160" y="150" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#555">+ a clock time</text>
  <circle cx="160" cy="245" r="62" fill="#fff" stroke="#1b4f72" stroke-width="3"/>
  <circle cx="160" cy="245" r="5" fill="#1b4f72"/>
  <line x1="160" y1="245" x2="160" y2="197" stroke="#1b4f72" stroke-width="5"/>
  <line x1="160" y1="245" x2="200" y2="245" stroke="#c0392b" stroke-width="4"/>
  <text x="160" y="205" font-family="DejaVu Sans" font-size="13" text-anchor="middle" fill="#1b4f72">12</text>
  <text x="215" y="249" font-family="DejaVu Sans" font-size="13" text-anchor="middle" fill="#1b4f72">3</text>
  <text x="160" y="292" font-family="DejaVu Sans" font-size="13" text-anchor="middle" fill="#1b4f72">6</text>
  <text x="105" y="249" font-family="DejaVu Sans" font-size="13" text-anchor="middle" fill="#1b4f72">9</text>
  <text x="160" y="345" font-family="DejaVu Sans" font-size="19" font-weight="bold" text-anchor="middle" fill="#c0392b">at 7 o'clock</text>
  <text x="160" y="370" font-family="DejaVu Sans" font-size="14" text-anchor="middle" fill="#555">at 6.30 / at noon / at night</text>

  <!-- ON panel -->
  <rect x="315" y="92" width="270" height="300" rx="14" fill="#eafaf1" stroke="#58d68d" stroke-width="2"/>
  <text x="450" y="126" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" fill="#1e8449">on</text>
  <text x="450" y="150" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#555">+ a day or date</text>
  <rect x="365" y="175" width="170" height="130" rx="8" fill="#fff" stroke="#1e8449" stroke-width="2.5"/>
  <rect x="365" y="175" width="170" height="26" rx="8" fill="#1e8449"/>
  <text x="450" y="194" font-family="DejaVu Sans" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">MONDAY</text>
  <text x="390" y="222" font-family="DejaVu Sans" font-size="12" text-anchor="middle" fill="#999">Mo</text>
  <text x="420" y="222" font-family="DejaVu Sans" font-size="12" text-anchor="middle" fill="#999">Tu</text>
  <text x="450" y="222" font-family="DejaVu Sans" font-size="12" text-anchor="middle" fill="#999">We</text>
  <text x="480" y="222" font-family="DejaVu Sans" font-size="12" text-anchor="middle" fill="#999">Th</text>
  <text x="510" y="222" font-family="DejaVu Sans" font-size="12" text-anchor="middle" fill="#999">Fr</text>
  <circle cx="450" cy="245" r="18" fill="#f7dc6f" stroke="#b7950b" stroke-width="2"/>
  <text x="450" y="251" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="middle" fill="#7d6608">17</text>
  <text x="450" y="345" font-family="DejaVu Sans" font-size="19" font-weight="bold" text-anchor="middle" fill="#c0392b">on Monday</text>
  <text x="450" y="370" font-family="DejaVu Sans" font-size="14" text-anchor="middle" fill="#555">on Friday / on 17 May / on my birthday</text>

  <!-- IN panel -->
  <rect x="605" y="92" width="270" height="300" rx="14" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2"/>
  <text x="740" y="126" font-family="DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" fill="#9a7d0a">in</text>
  <text x="740" y="150" font-family="DejaVu Sans" font-size="15" text-anchor="middle" fill="#555">+ a part of the day / month / year</text>
  <circle cx="740" cy="235" r="40" fill="#f7dc6f" stroke="#b7950b" stroke-width="2.5"/>
  <g stroke="#b7950b" stroke-width="3">
    <line x1="740" y1="183" x2="740" y2="170"/>
    <line x1="788" y1="235" x2="801" y2="235"/>
    <line x1="692" y1="235" x2="679" y2="235"/>
    <line x1="774" y1="201" x2="784" y2="191"/>
    <line x1="706" y1="201" x2="696" y2="191"/>
  </g>
  <path d="M 660 300 Q 740 250 820 300" stroke="#d4ac0d" stroke-width="3" fill="none"/>
  <rect x="660" y="300" width="160" height="5" fill="#9a7d0a"/>
  <text x="740" y="345" font-family="DejaVu Sans" font-size="19" font-weight="bold" text-anchor="middle" fill="#c0392b">in the morning</text>
  <text x="740" y="370" font-family="DejaVu Sans" font-size="14" text-anchor="middle" fill="#555">in May / in 2024 / in summer</text>

  <!-- bottom summary -->
  <rect x="25" y="410" width="850" height="44" rx="10" fill="#333"/>
  <text x="450" y="438" font-family="DejaVu Sans" font-size="17" text-anchor="middle" fill="#fff">I get up at 7 o'clock on Monday in the morning.   (at = small, on = middle, in = big)</text>
</svg>
