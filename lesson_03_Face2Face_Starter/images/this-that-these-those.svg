<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="560" fill="#fdfcf8"/>
  <text x="450" y="46" font-family="DejaVu Sans" font-size="30" font-weight="bold" text-anchor="middle" fill="#333">this / that / these / those</text>
  <text x="450" y="76" font-family="DejaVu Sans" font-size="17" text-anchor="middle" fill="#777">singular (one) = this / that      plural (more than one) = these / those</text>

  <!-- NEAR panel -->
  <rect x="30" y="100" width="410" height="430" rx="14" fill="#eaf4fb" stroke="#7fb3d9" stroke-width="2"/>
  <text x="235" y="134" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" fill="#2471a3">NEAR (here)</text>
  <text x="235" y="160" font-family="DejaVu Sans" font-size="16" text-anchor="middle" fill="#555">this + one thing   |   these + more than one</text>

  <!-- one phone (this) -->
  <rect x="90" y="200" width="86" height="150" rx="14" fill="#5dade2" stroke="#1b4f72" stroke-width="2.5"/>
  <rect x="100" y="214" width="66" height="104" rx="4" fill="#eaf2f8"/>
  <circle cx="133" cy="334" r="7" fill="#eaf2f8"/>
  <path d="M 176 275 L 250 250" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrR)"/>
  <text x="256" y="244" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#c0392b">this phone</text>
  <text x="256" y="270" font-family="DejaVu Sans" font-size="15" fill="#555">= the phone here (singular)</text>

  <!-- three pens (these) -->
  <g transform="rotate(-8 320 360)">
    <rect x="305" y="330" width="150" height="18" rx="4" fill="#f5b041" stroke="#9c640c" stroke-width="2"/>
    <polygon points="455,330 475,339 455,348" fill="#9c640c"/>
  </g>
  <g transform="rotate(6 320 392)">
    <rect x="305" y="362" width="150" height="18" rx="4" fill="#f7dc6f" stroke="#9c640c" stroke-width="2"/>
    <polygon points="455,362 475,371 455,380" fill="#9c640c"/>
  </g>
  <g transform="rotate(-2 320 424)">
    <rect x="305" y="394" width="150" height="18" rx="4" fill="#f8c471" stroke="#9c640c" stroke-width="2"/>
    <polygon points="455,394 475,403 455,412" fill="#9c640c"/>
  </g>
  <text x="133" y="420" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#c0392b">these pens</text>
  <text x="133" y="446" font-family="DejaVu Sans" font-size="15" fill="#555">= the pens here (plural)</text>

  <!-- FAR panel -->
  <rect x="460" y="100" width="410" height="430" rx="14" fill="#fdedec" stroke="#d98880" stroke-width="2"/>
  <text x="665" y="134" font-family="DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" fill="#943126">FAR (there)</text>
  <text x="665" y="160" font-family="DejaVu Sans" font-size="16" text-anchor="middle" fill="#555">that + one thing   |   those + more than one</text>

  <!-- one watch (that) -->
  <rect x="636" y="196" width="26" height="34" fill="#566573"/>
  <rect x="636" y="296" width="26" height="34" fill="#566573"/>
  <circle cx="649" cy="263" r="42" fill="#ec7063" stroke="#7b241c" stroke-width="2.5"/>
  <circle cx="649" cy="263" r="5" fill="#7b241c"/>
  <line x1="649" y1="263" x2="649" y2="235" stroke="#7b241c" stroke-width="4"/>
  <line x1="649" y1="263" x2="671" y2="270" stroke="#7b241c" stroke-width="3"/>
  <path d="M 691 263 L 745 240" stroke="#1e8449" stroke-width="2.5" fill="none" marker-end="url(#arrG)"/>
  <text x="751" y="234" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#1e8449">that watch</text>
  <text x="751" y="260" font-family="DejaVu Sans" font-size="15" fill="#555">= the watch there (singular)</text>

  <!-- three books (those) -->
  <rect x="520" y="340" width="52" height="110" rx="4" fill="#a569bd" stroke="#4a235a" stroke-width="2"/>
  <rect x="578" y="350" width="52" height="100" rx="4" fill="#48c9b0" stroke="#0b5345" stroke-width="2"/>
  <rect x="636" y="345" width="52" height="105" rx="4" fill="#f4d03f" stroke="#7d6608" stroke-width="2"/>
  <line x1="532" y1="340" x2="532" y2="450" stroke="#4a235a" stroke-width="2"/>
  <line x1="590" y1="350" x2="590" y2="450" stroke="#0b5345" stroke-width="2"/>
  <line x1="648" y1="345" x2="648" y2="450" stroke="#7d6608" stroke-width="2"/>
  <text x="700" y="410" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#1e8449">those books</text>
  <text x="700" y="436" font-family="DejaVu Sans" font-size="15" fill="#555">= the books there (plural)</text>

  <!-- bottom summary -->
  <rect x="30" y="500" width="840" height="44" rx="10" fill="#333"/>
  <text x="450" y="528" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#fff">Pattern:  What's this?  = It's a phone.      What are these?  = They're pens.</text>

  <defs>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#c0392b"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#1e8449"/>
    </marker>
  </defs>
</svg>
