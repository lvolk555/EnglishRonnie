<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="DejaVu Sans, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Present Simple — he / she / it adds -s</text>
  <text x="450" y="70" font-size="14" text-anchor="middle" fill="#666">Native instinct: the verb "agrees" with the subject — automatic muscle memory</text>

  <rect x="40" y="95" width="380" height="70" rx="10" fill="#e8f4fd" stroke="#2c6fbb" stroke-width="2"/>
  <text x="230" y="122" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c6fbb">I / you / we / they</text>
  <text x="230" y="150" font-size="15" text-anchor="middle" fill="#1a1a1a">→ verb stays the same</text>

  <rect x="480" y="95" width="380" height="70" rx="10" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/>
  <text x="670" y="122" font-size="16" font-weight="bold" text-anchor="middle" fill="#c0392b">he / she / it</text>
  <text x="670" y="150" font-size="15" text-anchor="middle" fill="#1a1a1a">→ verb + s / es / ies</text>

  <rect x="40" y="195" width="820" height="200" rx="10" fill="#fff8e1" stroke="#e67e22" stroke-width="2"/>
  <text x="60" y="230" font-size="18" font-weight="bold" fill="#e67e22">How to add the ending (3 spelling boxes)</text>
  <text x="60" y="268" font-size="16" fill="#1a1a1a">1. Most verbs: just + s</text>
  <text x="100" y="294" font-size="15" fill="#333">work → works · live → lives · read → reads · like → likes</text>
  <text x="60" y="328" font-size="16" fill="#1a1a1a">2. ends in -ss / -sh / -ch / -x / -o: + es</text>
  <text x="100" y="354" font-size="15" fill="#333">watch → watches · go → goes · miss → misses · fix → fixes</text>
  <text x="60" y="382" font-size="16" fill="#1a1a1a">3. consonant + y: y → ies</text>
  <text x="360" y="382" font-size="15" fill="#333">study → studies · fly → flies  (but: play → plays, vowel + y)</text>

  <rect x="40" y="425" width="820" height="150" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="60" y="460" font-size="18" font-weight="bold" fill="#27ae60">Negative &amp; question: use DOES, verb goes back</text>
  <text x="60" y="495" font-size="15" fill="#1a1a1a">She doesn't work on Sundays.  (NOT ~~doesn't works~~)</text>
  <text x="60" y="522" font-size="15" fill="#1a1a1a">Does he like coffee?  →  Yes, he does. / No, he doesn't.</text>
  <text x="60" y="552" font-size="14" fill="#666">Trick: does already carries the -s → the main verb is "naked" again.</text>
</svg>
